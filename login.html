<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Limiar — Login</title>
<link rel="icon" type="image/png" href="img/logo-limiar.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark"><img src="img/logo-limiar.png" alt="Portal Limiar"></div>
      <div>
        <div class="brand-name">Portal Limiar</div>
        <div class="brand-sub">Gestão de Obras</div>
      </div>
    </div>
    <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com" autocomplete="username"></div>
    <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="Sua senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
    <div class="login-error" id="login-error" style="display:none;color:var(--red,#d33);font-size:13px;margin:-6px 0 14px"></div>
    <button class="btn-primary" id="login-btn" onclick="login()">Entrar</button>
    <div class="login-foot">Portal Limiar — acesso restrito.</div>
  </div>
</div>

<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>

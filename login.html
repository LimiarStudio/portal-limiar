<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Limiar — Login</title>
<link rel="icon" type="image/png" href="img/logo-limiar.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark"><img src="img/logo-limiar.png" alt="Portal Limiar"></div>
      <div>
        <div class="brand-name">Portal Limiar</div>
        <div class="brand-sub">Gestão de Obras</div>
      </div>
    </div>
    <div class="field"><label>E-mail</label><input type="email" value="joyce@limiar.eng.br"></div>
    <div class="field"><label>Senha</label><input type="password" value="••••••••"></div>
    <button class="btn-primary" onclick="login()">Entrar</button>
    <div class="login-foot">Protótipo de demonstração — dados fictícios.</div>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
